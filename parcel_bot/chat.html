<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>parcel-bot chat</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-height: 8rem; white-space: pre-wrap; }
  #status { color: #666; font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2rem; }
  #status.error { color: #c00; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  input { flex: 1; padding: 0.5rem; }
</style>
</head>
<body>
<h1>parcel-bot</h1>
<form id="form">
  <input id="message" value="책 한 권 보내려고요" autocomplete="off">
  <button>보내기</button>
</form>
<div id="log"></div>
<div id="status"></div>

<script>
// 조용한 절단 감지용 클라이언트 watchdog: 이 시간 동안 수신이 없으면 끊긴 것으로 판정한다.
const WATCHDOG_MS = 3000;

const log = document.getElementById("log");
const status = document.getElementById("status");

function setStatus(text, isError) {
  status.textContent = text;
  status.className = isError ? "error" : "";
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  log.textContent = "";
  setStatus("응답 대기 중...");

  const controller = new AbortController();
  let watchdog;
  const resetWatchdog = () => {
    clearTimeout(watchdog);
    watchdog = setTimeout(() => {
      // 케이스 3 (조용한 절단): 소켓은 열려 있지만 데이터가 멈춘 상태.
      // 서버·네트워크는 아무 신호도 주지 않으므로 클라이언트 타임아웃만이 감지 수단이다.
      setStatus(`응답이 ${WATCHDOG_MS / 1000}초간 멈췄습니다. 연결이 끊긴 것으로 보입니다.`, true);
      controller.abort();
    }, WATCHDOG_MS);
  };

  try {
    const res = await fetch("/chat/", {
      method: "POST",
      body: JSON.stringify({ message: document.getElementById("message").value }),
      signal: controller.signal,
    });
    resetWatchdog();

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let done = false;

    while (true) {
      const { value, done: eof } = await reader.read();
      if (eof) break;
      resetWatchdog();
      buffer += decoder.decode(value, { stream: true });

      // SSE 프레임은 빈 줄로 구분된다.
      const frames = buffer.split("\n\n");
      buffer = frames.pop();
      for (const frame of frames) {
        let event = "message";
        let data = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event: ")) event = line.slice(7);
          if (line.startsWith("data: ")) data = line.slice(6);
        }
        if (event === "error") {
          // 케이스 4 (업스트림 중단): 연결은 살아 있고 서버가 에러를 이벤트로 알려준다.
          setStatus(`서버 오류: ${JSON.parse(data).message}`, true);
          done = true;
        } else if (data === "[DONE]") {
          setStatus("완료");
          done = true;
        } else if (data) {
          log.textContent += JSON.parse(data).token;
        }
      }
    }

    if (!done) {
      // 케이스 2 (서버 종료): [DONE] 없이 소켓이 닫혔다. 신호가 있는 절단이다.
      setStatus("응답이 완료되기 전에 연결이 닫혔습니다.", true);
    }
  } catch (err) {
    if (err.name !== "AbortError") {
      setStatus(`연결 오류: ${err.message}`, true);
    }
  } finally {
    clearTimeout(watchdog);
  }
});
</script>
</body>
</html>
